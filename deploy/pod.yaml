apiVersion: v1
kind: Pod
metadata:
  name: stashbook
spec:
  containers:
    - name: db
      image: docker.io/library/postgres:18
      env:
        - name: POSTGRES_PASSWORD
          value: "{{.POSTGRES_PASSWORD}}"
        - name: POSTGRES_USER
          value: "{{.POSTGRES_USER}}"
        - name: POSTGRES_DB
          value: "{{.POSTGRES_DB}}"
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: stashbook-pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stashbook-pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
